<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Phase 2 Weekly Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root{
    --dark:#141413; --light:#faf9f5; --mid:#b0aea5; --lgray:#e8e6dc;
    --orange:#d97757; --blue:#6a9bcc; --green:#788c5d;
    --red:#c0563f; --card:#ffffff; --muted:#6b6a63; --body:#3a3934;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--light);color:var(--dark);font-family:'Lora',Georgia,serif;line-height:1.65;-webkit-font-smoothing:antialiased;padding:24px 16px 64px;}
  .wrap{max-width:820px;margin:0 auto;}
  h1,h2,h3,h4,th,.nav,.kpi,.sel,.crumb,.wk-row{font-family:'Poppins',Arial,sans-serif;}
  .crumb{font-size:13px;margin-bottom:14px;}
  .crumb a{color:var(--muted);text-decoration:none;} .crumb a:hover{color:var(--orange);}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;}
  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
  .sub{color:var(--muted);font-size:14px;margin-top:4px;}
  .sel{font-size:13px;padding:7px 10px;border:1px solid var(--lgray);border-radius:10px;background:var(--card);color:var(--dark);max-width:100%;}
  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px;}
  .kpi{background:var(--dark);color:var(--light);border-radius:14px;padding:14px 16px;}
  .kpi .v{font-size:22px;font-weight:600;line-height:1.1;}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mid);margin-top:6px;}
  .pos{color:#9cc27e;} .neg{color:#e8917a;}
  /* Rendered markdown */
  article{background:var(--card);border:1px solid var(--lgray);border-radius:16px;padding:26px 28px;}
  article h2{font-size:20px;font-weight:600;margin:26px 0 10px;}
  article h3{font-size:17px;font-weight:600;margin:24px 0 8px;}
  article h4{font-size:15px;font-weight:600;margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--orange);}
  article > :first-child{margin-top:0;}
  article p,article li{font-size:15px;color:var(--body);}
  article p{margin:0 0 12px;}
  article ul,article ol{margin:0 0 14px 22px;}
  article li{margin-bottom:6px;}
  article strong{color:var(--dark);}
  article em{color:var(--muted);}
  article hr{border:none;border-top:1px solid var(--lgray);margin:22px 0;}
  article blockquote{border-left:4px solid var(--blue);padding:4px 14px;margin:0 0 14px;background:#f4f3ee;border-radius:0 8px 8px 0;}
  article a{color:var(--orange);}
  .tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--lgray);border-radius:12px;}
  article table{width:100%;border-collapse:collapse;font-size:13px;}
  article th{background:var(--dark);color:var(--light);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;text-align:left;font-weight:500;white-space:nowrap;}
  article td{padding:8px 10px;border-top:1px solid var(--lgray);font-family:'Poppins',Arial,sans-serif;font-size:12.5px;vertical-align:top;}
  /* Week list */
  .wk-list{display:flex;flex-direction:column;gap:8px;}
  .wk-row{display:grid;grid-template-columns:70px 1fr auto auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--lgray);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--dark);font-size:14px;}
  .wk-row:hover{border-color:var(--orange);}
  .wk-row .w{font-weight:600;} .wk-row .d{color:var(--muted);}
  .wk-row .r{font-weight:600;text-align:right;min-width:70px;} .wk-row .s{color:var(--muted);font-size:12.5px;text-align:right;min-width:110px;}
  .posd{color:var(--green);} .negd{color:var(--red);}
  .section-label{font-family:'Poppins',Arial,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px;}
  /* Prev / next */
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px;}
  .nav a{color:var(--dark);background:var(--card);border:1px solid var(--lgray);border-radius:20px;padding:7px 14px;text-decoration:none;}
  .nav a:hover{border-color:var(--orange);}
  .nav .spacer{flex:1;}
  .err{background:#fbeae3;color:#a8462e;border:1px solid #f0c9bd;border-radius:10px;padding:10px 14px;font-size:13px;font-family:'Poppins',sans-serif;}
  footer{margin-top:32px;text-align:center;font-size:11.5px;color:var(--mid);font-family:'Poppins',sans-serif;}
  @media(max-width:640px){
    article{padding:18px 16px;}
    .kpi .v{font-size:18px;}
    .kpis{gap:8px;}
    .kpi{padding:12px;}
    .wk-row{grid-template-columns:56px 1fr auto;}
    .wk-row .s{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="./">&larr; Dashboard</a></div>
  <header>
    <div>
      <h1 id="title">Loading&hellip;</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <select class="sel" id="picker" aria-label="Choose a week or review"></select>
  </header>
  <div id="kpis"></div>
  <div id="content"></div>
  <div class="nav" id="nav"></div>
  <footer>Phase 2 portfolio experiment &middot; updated automatically every Saturday &middot; not financial advice</footer>
</div>

<script>
const $ = id => document.getElementById(id);
let WEEKS = [];      // [{n, date, md}]
let REVIEWS = [];    // [{id, title, md}]
let TRACKER = {};    // n -> {total, spy, qqq, vsSpy, vsQqq}
let LEDGER = "";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderMd(md){
  const html = DOMPurify.sanitize(marked.parse(md, {gfm:true}));
  return html.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
}

function sectionBetween(text, startHeading, endHeading){
  const a = text.indexOf(startHeading);
  if(a < 0) return "";
  const b = endHeading ? text.indexOf(endHeading, a + startHeading.length) : -1;
  return text.slice(a + startHeading.length, b < 0 ? undefined : b);
}

function parseLog(log){
  log = log.replace(/\r\n/g, "\n");
  // Weekly entries
  const entries = sectionBetween(log, "\n## Weekly Entries", "\n## Quarterly Reviews");
  const parts = entries.split(/\n(?=### Week \d+)/);
  for(const p of parts){
    const m = p.match(/^### Week (\d+)\s*[:\u2014-]?\s*(.*)\n/);
    if(!m) continue;
    const body = p.slice(m[0].length).replace(/\n-{3,}\s*$/,"").trim();
    WEEKS.push({n:+m[1], date:m[2].trim(), md:body});
  }
  WEEKS.sort((a,b) => a.n - b.n);
  // Quarterly / phase reviews: every "## ... Review" section after the Quarterly Reviews index
  const qr = sectionBetween(log, "\n## Quarterly Reviews", "\n## Concepts Learned Index");
  for(const p of qr.split(/\n(?=## )/)){
    const m = p.match(/^## (.*Review.*)\n/);
    if(!m) continue;
    const title = m[1].trim();
    REVIEWS.push({id:"review-" + title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),
                  title, md:p.slice(m[0].length).replace(/\n-{3,}\s*$/,"").trim()});
  }
  // Cumulative tracker rows for the KPI strip and the week list
  const tr = sectionBetween(log, "\n## Cumulative Performance Tracker", "\n## ");
  for(const line of tr.split("\n")){
    const c = line.split("|").map(s => s.trim());
    const wm = (c[1]||"").match(/^W(\d+)$/);
    if(!wm || c.length < 11) continue;
    const num = s => parseFloat(s.replace(/[^0-9.+-]/g,""));
    TRACKER[+wm[1]] = {total:num(c[6]), spy:num(c[7]), qqq:num(c[8]), vsSpy:num(c[9]), vsQqq:num(c[10])};
  }
}

const sign = (x, unit) => isNaN(x) ? "&mdash;" : `${x>=0?"+":""}${x.toFixed(2)}${unit}`;
const kpi = (x, unit, label) => `<div class="kpi"><div class="v ${x>=0?"pos":"neg"}">${sign(x,unit)}</div><div class="l">${label}</div></div>`;

function setHeader(title, sub){
  $("title").textContent = title;
  $("subtitle").textContent = sub || "";
  document.title = /Phase/.test(title) ? title : title + " · Phase 2";
}

function showWeek(n){
  const i = WEEKS.findIndex(w => w.n === n);
  if(i < 0) return showWeek(WEEKS[WEEKS.length-1].n);
  const w = WEEKS[i];
  const latest = i === WEEKS.length - 1;
  setHeader(`Week ${w.n} Review`, `${w.date}${latest ? " · latest" : ""}`);
  const t = TRACKER[w.n];
  $("kpis").innerHTML = t ? `<div class="kpis">${kpi(t.total,"%","Total return")}${kpi(t.vsSpy," pp","vs. SPY")}${kpi(t.vsQqq," pp","vs. QQQ")}</div>` : "";
  $("content").innerHTML = `<article>${renderMd(w.md)}</article>`;
  const prev = WEEKS[i-1], next = WEEKS[i+1];
  $("nav").innerHTML = (prev ? `<a href="#w${prev.n}">&larr; Week ${prev.n}</a>` : "") +
    `<span class="spacer"></span>` + (next ? `<a href="#w${next.n}">Week ${next.n} &rarr;</a>` : `<a href="#weeks">All weeks</a>`);
}

function showLedger(){
  setHeader("Lessons Ledger", "Durable lessons only, append-only");
  $("kpis").innerHTML = "";
  $("content").innerHTML = `<article>${renderMd(LEDGER.replace(/^# .*\n/, ""))}</article>`;
  $("nav").innerHTML = `<a href="#weeks">All weeks</a><span class="spacer"></span><a href="./">Dashboard &rarr;</a>`;
}

function showReview(r){
  setHeader(r.title, "Periodic review");
  $("kpis").innerHTML = "";
  $("content").innerHTML = `<article>${renderMd(r.md)}</article>`;
  $("nav").innerHTML = `<a href="#weeks">All weeks</a><span class="spacer"></span><a href="#w${WEEKS[WEEKS.length-1].n}">Latest week &rarr;</a>`;
}

function showList(){
  setHeader("All Weekly Reviews", `${WEEKS.length} weeks since May 11, 2026`);
  $("kpis").innerHTML = "";
  const rows = [...WEEKS].reverse().map(w => {
    const t = TRACKER[w.n] || {};
    return `<a class="wk-row" href="#w${w.n}"><span class="w">W${w.n}</span><span class="d">${esc(w.date)}</span>
      <span class="r ${t.total>=0?"posd":"negd"}">${sign(t.total,"%")}</span><span class="s">${sign(t.vsSpy," pp")} vs SPY</span></a>`;
  }).join("");
  const revs = REVIEWS.map(r => `<a class="wk-row" href="#${r.id}"><span class="w">&#9733;</span><span class="d">${esc(r.title)}</span><span></span><span></span></a>`).join("");
  $("content").innerHTML = (revs ? `<div class="section-label">Periodic reviews</div><div class="wk-list">${revs}</div>` : "") +
    `<div class="section-label">Weeks</div><div class="wk-list">${rows}</div>`;
  $("nav").innerHTML = "";
}

function buildPicker(){
  const opts = [...WEEKS].reverse().map(w => `<option value="w${w.n}">Week ${w.n} · ${esc(w.date)}</option>`);
  REVIEWS.forEach(r => opts.push(`<option value="${r.id}">${esc(r.title)}</option>`));
  opts.push(`<option value="ledger">Lessons Ledger</option>`, `<option value="weeks">All weeks</option>`);
  $("picker").innerHTML = opts.join("");
  $("picker").onchange = e => { location.hash = e.target.value; };
}

function route(){
  const h = location.hash.slice(1);
  if(h === "ledger") showLedger();
  else if(h === "weeks") showList();
  else if(h.startsWith("review-") && REVIEWS.find(r => r.id === h)) showReview(REVIEWS.find(r => r.id === h));
  else if(/^w\d+$/.test(h)) showWeek(+h.slice(1));
  else showWeek(WEEKS[WEEKS.length-1].n);
  const cur = h || `w${WEEKS[WEEKS.length-1].n}`;
  if([...$("picker").options].some(o => o.value === cur)) $("picker").value = cur;
  window.scrollTo(0, 0);
}

(async () => {
  try{
    const [log, ledger] = await Promise.all(["Phase_2_Weekly_Review_Log.md","Phase_2_Lessons_Ledger.md"]
      .map(f => fetch(f, {cache:"no-cache"}).then(r => { if(!r.ok) throw new Error(f + " " + r.status); return r.text(); })));
    parseLog(log);
    LEDGER = ledger.replace(/\r\n/g, "\n");
    if(!WEEKS.length) throw new Error("no weekly entries found in the log");
    buildPicker();
    window.addEventListener("hashchange", route);
    route();
  }catch(e){
    setHeader("Couldn't load the review", "");
    $("content").innerHTML = `<div class="err">${esc(String(e.message || e))}</div>`;
  }
})();
</script>
</body>
</html>
